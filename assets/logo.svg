<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Jellyfin Federation logo: two servers federated, streams proxied A<-B -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4c81"/>
      <stop offset="1" stop-color="#1273b8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- remote server B (upper-left) -->
  <g>
    <rect x="92" y="120" width="150" height="66" rx="14" fill="#e8f2fb"/>
    <rect x="92" y="206" width="150" height="66" rx="14" fill="#e8f2fb"/>
    <circle cx="120" cy="153" r="9" fill="#1273b8"/>
    <circle cx="120" cy="239" r="9" fill="#1273b8"/>
    <rect x="142" y="146" width="82" height="14" rx="7" fill="#9fc6e8"/>
    <rect x="142" y="232" width="82" height="14" rx="7" fill="#9fc6e8"/>
  </g>
  <!-- local server A (lower-right) -->
  <g>
    <rect x="270" y="246" width="150" height="66" rx="14" fill="#e8f2fb"/>
    <rect x="270" y="332" width="150" height="66" rx="14" fill="#e8f2fb"/>
    <circle cx="298" cy="279" r="9" fill="#1273b8"/>
    <circle cx="298" cy="365" r="9" fill="#1273b8"/>
    <rect x="320" y="272" width="82" height="14" rx="7" fill="#9fc6e8"/>
    <rect x="320" y="358" width="82" height="14" rx="7" fill="#9fc6e8"/>
  </g>
  <!-- proxy link B -> A (federation), with arrowhead -->
  <g fill="none" stroke="#ffd23f" stroke-width="18" stroke-linecap="round">
    <path d="M214 186 C 288 200, 300 214, 322 246"/>
  </g>
  <g fill="#ffd23f">
    <path d="M330 258 l-34 -14 12 -12 34 14 z"/>
  </g>
</svg>
