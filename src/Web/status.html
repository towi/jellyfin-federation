<!DOCTYPE html>
<html>
<head>
    <title>Jellyfin Federation Status</title>
</head>
<body>
    <div id="federationStatusPage" data-role="page" class="page type-interior federationStatusPage">
        <div data-role="content">
            <div class="content-primary">
                <h1>Jellyfin Federation</h1>
                <div class="fieldDescription" style="margin-bottom:1em;">
                    Status of all federated remote servers. Updated automatically every 5 seconds.
                </div>
                <div id="federationStatusTable"></div>
            </div>
        </div>
        <script type="text/javascript">
            function el(tag, attrs, text) {
                var e = document.createElement(tag);
                Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
                if (text) { e.textContent = text; }
                return e;
            }

            function renderStatus(rows) {
                var host = document.getElementById('federationStatusTable');
                host.innerHTML = '';
                var table = el('div', { 'class': 'itemsContainer vertical-wrap centered' });
                if (!rows.length) {
                    table.appendChild(el('div', { 'class': 'fieldDescription' }, 'No instances configured.'));
                }
                rows.forEach(function (row) {
                    var line = el('div', { 'style': 'display:flex; gap:1em; align-items:center; padding:.4em 0; border-bottom:1px solid rgba(128,128,128,.15);' });
                    var dot = el('span', {
                        'style': 'width:.9em; height:.9em; border-radius:50%; display:inline-block; flex-shrink:0; background:'
                            + (row.State === 'Online' ? '#4caf50' : row.State === 'InvalidCredentials' ? '#f44336' : '#ff9800')
                    });
                    line.appendChild(dot);
                    line.appendChild(el('strong', {}, row.Alias));
                    var meta = row.State + (row.RemoteServerName ? ' — ' + row.RemoteServerName + ' ' + (row.RemoteVersion || '') : '');
                    line.appendChild(el('span', { 'class': 'fieldDescription' }, meta));
                    table.appendChild(line);
                    if (row.Channels && row.Channels.length) {
                        table.appendChild(el('div', { 'class': 'fieldDescription', 'style': 'margin-left:1.6em; padding-bottom:.4em;' },
                            row.Channels.join(', ')));
                    }
                });
                host.appendChild(table);
            }

            function renderError(err) {
                var host = document.getElementById('federationStatusTable');
                host.innerHTML = '';
                host.appendChild(el('div', { 'class': 'fieldDescription', 'style': 'color:#f44336;' },
                    'Status unavailable' + (err && err.statusText ? ' (' + err.statusText + ')' : '') + '. The server may be restarting.'));
            }

            function refreshStatus() {
                ApiClient.ajax({ url: ApiClient.getUrl('Federation/Status/Public'), type: 'GET' })
                    .then(renderStatus, renderError);
            }

            document.querySelector('.federationStatusPage')
                .addEventListener('pageshow', function () {
                    if (window.__fedStatusTimer) { window.clearInterval(window.__fedStatusTimer); }
                    refreshStatus();
                    window.__fedStatusTimer = window.setInterval(refreshStatus, 5000);
                });
        </script>
    </div>
</body>
</html>
